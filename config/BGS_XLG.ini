# GoFish config — BGS + XLG forecast
# Cosmology: Planck 2018 LCDM + single massive neutrino (0.06 eV)

# ---- Reference cosmology (matches JSON) ----
A_s = 2.083e-9
n_s = 0.9649
h = 0.6736
omega_b = 0.02237
omega_cdm = 0.12
tau_reio = 0.0544
Sum_mnu = 0.06
Omega_k = 0.0
nu_hierarchy = degenerate

# ---- Forecasting parameters ----
kmin = 0.001
kmax = 0.5
skyarea = 12000.0
# Bias values in the input file are at the bin center (not at z=0), so do NOT
# rescale them by 1/D(z) — leave scale_bias off.
scale_bias = False
# Full P(k) shape (sigma_8 and f*sigma_8 forecasts), not just BAO peak.
BAO_only = False
fast_integration = True

# ---- I/O ----
inputfile = input_files/BGS_XLG_nbar.txt
outputfile = output_files/BGS_XLG
